<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Thông báo Socket</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      .notification-container {
        position: relative;
        display: inline-block;
        cursor: pointer;
      }

      .notification-badge {
        position: absolute;
        top: -5px;
        right: -10px;
        background: red;
        color: white;
        font-size: 14px;
        padding: 8px 13px;
        border-radius: 50%;
        display: none;
      }

      .popup {
        position: absolute;
        top: 70px;
        right: 0;
        background: #fff;
        border: 1px solid #ddd;
        width: 250px;
        max-height: 300px;
        overflow-y: auto;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 100;
      }

      .popup-message {
        padding: 10px;
        border-bottom: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <div style="padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <h2>Thông báo Socket.IO</h2>

      <!-- Ô nhập user_id -->
      <input type="text" id="userIdInput" placeholder="Nhập user_id" style="padding: 5px; width: 300px" />

      <div class="notification-container" id="notificationBell">
        <span style="font-size: 50px">🔔</span>
        <span class="notification-badge" id="notificationCount">0</span>
        <div class="popup" id="notificationPopup"></div>
      </div>

      <button id="connectButton">Kết nối</button>
      <button id="disconnectButton">Ngắt kết nối</button>
    </div>

    <script>
      let count = 0

      const socket = io('http://localhost:3000', {
        auth: { userId: '' }, // ban đầu rỗng
        autoConnect: false,
        reconnection: false
      })

      const notificationCount = document.getElementById('notificationCount')
      const notificationPopup = document.getElementById('notificationPopup')
      const notificationBell = document.getElementById('notificationBell')
      const connectButton = document.getElementById('connectButton')
      const disconnectButton = document.getElementById('disconnectButton')
      const userIdInput = document.getElementById('userIdInput')

      connectButton.addEventListener('click', () => {
        const userId = userIdInput.value.trim()
        if (!userId) {
          alert('Vui lòng nhập user_id.')
          return
        }

        // Cập nhật userId vào auth rồi kết nối
        socket.auth.userId = userId
        socket.connect()
      })

      disconnectButton.addEventListener('click', () => {
        socket.disconnect()
      })

      socket.on('connect', () => {
        console.log('Socket connected with userId:', socket.auth.userId)
      })

      socket.on('disconnect', () => {
        console.log('Socket disconnected')
      })

      socket.on('notify:send', (data) => {
        console.log('Received notification:', data)

        if (!data || !data.content) return

        count++
        notificationCount.innerText = count
        notificationCount.style.display = 'inline'

        const messageDiv = document.createElement('div')
        messageDiv.className = 'popup-message'
        messageDiv.innerText = data.content
        notificationPopup.prepend(messageDiv)
      })

      // Toggle popup
      notificationBell.addEventListener('click', () => {
        const isOpen = notificationPopup.style.display === 'block'
        notificationPopup.style.display = isOpen ? 'none' : 'block'

        if (!isOpen) {
          count = 0
          notificationCount.innerText = '0'
          notificationCount.style.display = 'none'
        }
      })

      // Đóng popup khi click ra ngoài
      window.addEventListener('click', (e) => {
        if (!notificationBell.contains(e.target)) {
          notificationPopup.style.display = 'none'
        }
      })
    </script>
  </body>
</html>
